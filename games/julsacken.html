<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tomtens Julsäck</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(to bottom, #0f172a, #1e3a8a);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

#game{
    width:min(95vw, 800px);
    height:min(85vh, 700px);
    background:
        linear-gradient(to bottom,
        #0ea5e9 0%,
        #38bdf8 60%,
        #ffffff 100%);
    border-radius:20px;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 30px rgba(0,0,0,0.4);
}

#hud{
    position:absolute;
    top:10px;
    left:0;
    right:0;
    display:flex;
    justify-content:space-around;
    z-index:10;
    font-size:1.2rem;
    font-weight:bold;
    color:#fff;
    text-shadow:1px 1px 2px #000;
}

#player{
    position:absolute;
    bottom:15px;
    width:80px;
    height:55px;
    font-size:3rem;
    display:flex;
    justify-content:center;
    align-items:center;
    user-select:none;
}

.item{
    position:absolute;
    width:50px;
    height:50px;
    font-size:2rem;
    display:flex;
    justify-content:center;
    align-items:center;
}

.message{
    position:absolute;
    font-size:1.5rem;
    font-weight:bold;
    pointer-events:none;
    animation:pop 0.8s forwards;
}

.good{
    color:green;
}

.bad{
    color:red;
}

@keyframes pop{
    0%{
        opacity:1;
        transform:translateY(0);
    }
    100%{
        opacity:0;
        transform:translateY(-50px);
    }
}

#startScreen,
#endScreen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.8);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    z-index:20;
}

h1{
    margin-bottom:15px;
}

p{
    margin-bottom:10px;
}

button{
    padding:14px 24px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:1.1rem;
    font-weight:bold;
    background:#ef4444;
    color:white;
    margin-top:15px;
}

button:hover{
    background:#dc2626;
}

#snow{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.snowflake{
    position:absolute;
    color:white;
    opacity:0.8;
    animation:snowfall linear forwards;
}

@keyframes snowfall{
    from{
        transform:translateY(-20px);
    }
    to{
        transform:translateY(800px);
    }
}
</style>
</head>
<body>

<div id="game">

    <div id="hud">
        <div>🎁 Poäng: <span id="score">0</span></div>
        <div>⏰ Tid: <span id="time">30</span></div>
    </div>

    <div id="snow"></div>

    <div id="player">👜</div>

    <div id="startScreen">
        <h1>🎅 Tomtens Julsäck</h1>
        <p>Fånga julklappar och polkagrisar.</p>
        <p>Undvik kolbitar!</p>
        <p>30 sekunder att samla poäng.</p>
        <button id="startBtn">Starta spelet</button>
    </div>

    <div id="endScreen" style="display:none;">
        <h1>🎄 Tiden är ute!</h1>
        <h2>Poäng: <span id="finalScore"></span></h2>
        <button id="restartBtn">Spela igen</button>
    </div>

</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");

const startScreen = document.getElementById("startScreen");
const endScreen = document.getElementById("endScreen");
const finalScore = document.getElementById("finalScore");

let score = 0;
let timeLeft = 30;
let gameRunning = false;

let playerX = 300;

const items = [];

function updatePlayer() {
    player.style.left = playerX + "px";
}

function spawnItem() {

    const types = [
        { emoji: "🎁", points: 10 },
        { emoji: "🍭", points: 5 },
        { emoji: "🪨", points: -10 }
    ];

    const type = types[Math.floor(Math.random() * types.length)];

    const item = document.createElement("div");
    item.className = "item";
    item.textContent = type.emoji;

    const x = Math.random() * (game.clientWidth - 50);

    item.style.left = x + "px";
    item.style.top = "-50px";

    game.appendChild(item);

    items.push({
        element: item,
        x: x,
        y: -50,
        points: type.points
    });
}

function gameLoop() {

    if (!gameRunning) return;

    for (let i = items.length - 1; i >= 0; i--) {

        const item = items[i];

        item.y += 4;

        item.element.style.top = item.y + "px";

        const playerRect = player.getBoundingClientRect();
        const itemRect = item.element.getBoundingClientRect();

        const hit =
            playerRect.left < itemRect.right &&
            playerRect.right > itemRect.left &&
            playerRect.top < itemRect.bottom &&
            playerRect.bottom > itemRect.top;

        if (hit) {

            score += item.points;
            scoreEl.textContent = score;

            item.element.remove();
            items.splice(i, 1);

            continue;
        }

        if (item.y > game.clientHeight) {

            item.element.remove();
            items.splice(i, 1);
        }
    }

    requestAnimationFrame(gameLoop);
}

function startGame() {

    score = 0;
    timeLeft = 30;

    scoreEl.textContent = score;
    timeEl.textContent = timeLeft;

    startScreen.style.display = "none";
    endScreen.style.display = "none";

    gameRunning = true;

    const spawnInterval = setInterval(() => {

        if (gameRunning) {
            spawnItem();
        }

    }, 500);

    const timer = setInterval(() => {

        timeLeft--;

        timeEl.textContent = timeLeft;

        if (timeLeft <= 0) {

            gameRunning = false;

            clearInterval(timer);
            clearInterval(spawnInterval);

            finalScore.textContent = score;

            endScreen.style.display = "flex";
        }

    }, 1000);

    gameLoop();
}

document.getElementById("startBtn")
    .addEventListener("click", startGame);

document.getElementById("restartBtn")
    .addEventListener("click", startGame);

window.addEventListener("keydown", (e) => {

    if (!gameRunning) return;

    if (e.key === "ArrowLeft") {
        playerX -= 25;
    }

    if (e.key === "ArrowRight") {
        playerX += 25;
    }

    playerX = Math.max(
        0,
        Math.min(game.clientWidth - 80, playerX)
    );

    updatePlayer();
});

game.addEventListener("mousemove", (e) => {

    if (!gameRunning) return;

    const rect = game.getBoundingClientRect();

    playerX = e.clientX - rect.left - 40;

    playerX = Math.max(
        0,
        Math.min(game.clientWidth - 80, playerX)
    );

    updatePlayer();
});

game.addEventListener("touchmove", (e) => {

    if (!gameRunning) return;

    const touch = e.touches[0];
    const rect = game.getBoundingClientRect();

    playerX = touch.clientX - rect.left - 40;

    playerX = Math.max(
        0,
        Math.min(game.clientWidth - 80, playerX)
    );

    updatePlayer();
});

updatePlayer();
</script>
</body>
</html>
