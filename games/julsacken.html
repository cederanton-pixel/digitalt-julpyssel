<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tomtens Julsäck</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(to bottom, #0f172a, #1e3a8a);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

#game{
    width:min(95vw, 800px);
    height:min(85vh, 700px);
    background:
        linear-gradient(to bottom,
        #0ea5e9 0%,
        #38bdf8 60%,
        #ffffff 100%);
    border-radius:20px;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 30px rgba(0,0,0,0.4);
}

#hud{
    position:absolute;
    top:10px;
    left:0;
    right:0;
    display:flex;
    justify-content:space-around;
    z-index:10;
    font-size:1.2rem;
    font-weight:bold;
    color:#fff;
    text-shadow:1px 1px 2px #000;
}

#player{
    position:absolute;
    bottom:15px;
    width:80px;
    height:55px;
    font-size:3rem;
    display:flex;
    justify-content:center;
    align-items:center;
    user-select:none;
}

.item{
    position:absolute;
    width:50px;
    height:50px;
    font-size:2rem;
    display:flex;
    justify-content:center;
    align-items:center;
}

.message{
    position:absolute;
    font-size:1.5rem;
    font-weight:bold;
    pointer-events:none;
    animation:pop 0.8s forwards;
}

.good{
    color:green;
}

.bad{
    color:red;
}

@keyframes pop{
    0%{
        opacity:1;
        transform:translateY(0);
    }
    100%{
        opacity:0;
        transform:translateY(-50px);
    }
}

#startScreen,
#endScreen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.8);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    z-index:20;
}

h1{
    margin-bottom:15px;
}

p{
    margin-bottom:10px;
}

button{
    padding:14px 24px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:1.1rem;
    font-weight:bold;
    background:#ef4444;
    color:white;
    margin-top:15px;
}

button:hover{
    background:#dc2626;
}

#snow{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.snowflake{
    position:absolute;
    color:white;
    opacity:0.8;
    animation:snowfall linear forwards;
}

@keyframes snowfall{
    from{
        transform:translateY(-20px);
    }
    to{
        transform:translateY(800px);
    }
}
</style>
</head>
<body>

<div id="game">

    <div id="hud">
        <div>🎁 Poäng: <span id="score">0</span></div>
        <div>⏰ Tid: <span id="time">30</span></div>
    </div>

    <div id="snow"></div>

    <div id="player">👜</div>

    <div id="startScreen">
        <h1>🎅 Tomtens Julsäck</h1>
        <p>Fånga julklappar och polkagrisar.</p>
        <p>Undvik kolbitar!</p>
        <p>30 sekunder att samla poäng.</p>
        <button id="startBtn">Starta spelet</button>
    </div>

    <div id="endScreen" style="display:none;">
        <h1>🎄 Tiden är ute!</h1>
        <h2>Poäng: <span id="finalScore"></span></h2>
        <button id="restartBtn">Spela igen</button>
    </div>

</div>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const score
